name: Collect RFP leads
on:
  schedule:
    - cron: "15 19 * * *"   # 19:15 UTC = 6:15 am Sydney (AEDT), before the 7:25 am A1 run
  workflow_dispatch:
    inputs:
      sam_days_back:
        description: "One-off: SAM.gov days to look back (blank = normal 3; max 364)"
        required: false
        default: ""
      sam_title:
        description: "One-off: only SAM.gov notices whose title has this word (e.g. wayfinding)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect leads
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_DAYS_BACK: ${{ inputs.sam_days_back }}
          SAM_TITLE: ${{ inputs.sam_title }}
        run: python -m collector.collect
      - name: Publish
        run: |
          git config user.name "rfp-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "Leads $(date -u +%F)"
          git push
