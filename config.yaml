# Engage RFP lead collector: settings.
# Everything here is a LEAD source. Claude's daily runs verify each lead on the
# buyer's official page before anything reaches the tracker's Pipeline.
#
# House rules (see claude/rfp-collector-tools.md in the project):
# - official APIs, official feeds and public pages only;
# - respect robots.txt for every page or feed that isn't an API;
# - go slowly (one request per second per site) and identify ourselves;
# - never log in, never get around a block.

# Phrases that make an item a lead (case-insensitive, matched on title + description).
keywords:
  - wayfinding
  - way-finding
  - campus map
  - interactive map
  - digital map
  - online map
  - web map
  - story map
  - map viewer
  - illustrated map
  - map illustration
  - visitor map
  - trail map
  - precinct map
  - virtual tour
  - 360 tour
  - 360-degree
  - 360 degree
  - virtual walkthrough
  - virtual campus
  - campus tour
  - self-guided tour
  - digital directory
  - interactive directory
  - augmented reality
  - virtual reality
  - signage design
  - signage strategy
  - signage master plan
  - signage guidelines
  - signage standards
  - sign family
  - environmental graphics
  - environmental graphic design
  - interpretive signage
  - interpretive sign
  - wayside exhibit
  - car park signage
  - parking wayfinding
  - digital interactive
  - visitor experience

# If any of these appear, the item is dropped (core scope is not our work).
exclude:
  - traffic sign
  - road sign
  - street sign
  - speed sign
  - variable message sign
  - parking guidance
  - occupancy sensor
  - license plate
  - lidar
  - cadastral
  - topographic survey
  - aerial imagery
  - flood map
  - hazard map
  - zoning map
  - ng911
  - fleet tracking
  - sitemap

# How many days of leads to publish in docs/leads.json.
publish_days: 21

sources:
  # US federal. Needs a free SAM.gov API key stored as the GitHub secret SAM_API_KEY
  # (SAM.gov > Account Details > API Key). Skipped, and reported, until the key exists.
  sam_gov:
    enabled: true
    days_back: 3
    # A personal key allows about 10 calls a day, so we read ALL new notices
    # (pages of 1000) and filter them here with the keywords above, instead of
    # one search per keyword. max_calls keeps us under the daily limit.
    max_calls: 8
    # Notices with these codes are kept even without a keyword (exclusions still apply).
    naics: ["541430", "541370"]   # graphic design; mapping (surveying and mapping)
    psc: ["T099"]                 # the product code the VA used for wayfinding maps

  # US grants: early warning (grant winners usually tender soon after). Keyless.
  grants_gov:
    enabled: true
    keywords: [wayfinding, signage, interpretive, virtual tour, interactive map]

  # NSW eTendering public API (keyless, rate-limited per IP).
  # Docs: github.com/NSW-eTendering/NSW-eTendering-API. We ask for open (published)
  # RFTs only and follow links.next through every page; planned procurements are
  # added as early-warning "forecast" leads.
  # OFF since 2 Nov 2026: tenders.nsw.gov.au now forwards to buy.nsw.gov.au, which
  # refuses the API (403). NSW open tenders must be on buy.nsw from 2026; its API is for
  # agencies only, so NSW reaches us through buy.nsw's nightly supplier email instead.
  nsw_etendering:
    enabled: false
    results_per_page: 100
    max_pages: 40
    planned: true

  # US council agendas (Legistar public web API): early warning, months before an RFP.
  # Add a council's Legistar client name (the part before .legistar.com).
  legistar:
    enabled: true
    days_back: 14
    terms: [wayfinding, campus map, virtual tour, signage master plan, interactive map]
    # Client names are the webapi.legistar.com ones (not always the <name>.legistar.com site).
    # Sacramento's is "sacramento". Chicago is not on the Legistar API (HTTP 500 "not set up" for
    # every name tried, Nov 2026), so it is left out.
    clients: [seattle, denver, phoenix, sanantonio, austintexas, fortworthgov, boston, sfgov, oakland, longbeach, sanjose, sacramento, pittsburgh, milwaukee, columbus, nashville, kansascity, minneapolismn, stpaul]

  # RSS feeds: bid-page feeds of target buyers (e.g. CivicPlus "Bids" RSS),
  # Google Alerts RSS (when switched from email), Talkwalker Alerts.
  # Each entry: {name: ..., url: ...}. robots.txt is checked before every fetch.
  rss: []

  # Public bid pages of target buyers (page watching). Each table row / list item with a
  # link (or a lone link) whose text matches our keywords becomes a lead, once (state/seen.json
  # remembers it). Row text is used when the link only says "View" or "Details".
  # robots.txt is checked before every fetch. Public pages only: never a login portal
  # (Bonfire, BidNet, TenderLink, OpenGov, VendorPanel buyer portals etc.).
  # Each entry: {name: ..., url: ..., region: ...}
  pages:
    # NZ: GETS public "Current tenders" list (no login needed to read it), all pages.
    - name: GETS (NZ) current tenders
      url: "https://www.gets.govt.nz/ExternalIndex.htm?page={page}&orderBy=date"
      max_pages: 25
      region: New Zealand
    - name: GETS (NZ) future procurement opportunities
      url: "https://www.gets.govt.nz/FutureProcurementOpportunitiesIndex.htm"
      region: New Zealand
      kind: forecast
    # Not watched (refused or login-only): County of Marin (403), APA planning.org RFP list (404, moved), Planetizen (403).
    # US / AU buyers from the test list (claude/rfp-test-list-data.csv): their own public bids pages.
    - {name: University of Arkansas at Little Rock, url: "https://ualr.edu/procurement/bids", region: USA (AR)}
    - {name: Cuyahoga Community College (Tri-C), url: "https://www.tri-c.edu/administrative-departments/procurement/current-opportunitiesawards.html", region: USA (OH)}
    - {name: Merced Community College District, url: "https://www.mccd.edu/about-merced-college/divisions/admin-services/purchasing/bids/", region: USA (CA)}
    - {name: Eastern Kentucky University, url: "https://purchasing.eku.edu/solicitations", region: USA (KY)}
    - {name: Washington County MN, url: "https://washingtoncountymn.gov/bids.aspx", region: USA (MN)}
    - {name: Village of Western Springs, url: "https://www.wsprings.com/bids.aspx", region: USA (IL)}
    - {name: Shire of East Pilbara, url: "https://www.eastpilbara.wa.gov.au/tenders", region: Australia (WA)}
    - {name: Bellingen Shire Council, url: "https://www.bellingen.nsw.gov.au/Business/Doing-business-with-us/Tenders-and-Quotations", region: Australia (NSW)}

  # AusTender (Australian Government) official RSS of current Approaches to Market.
  # The feed address is looked up each run from its data.gov.au record.
  # OFF since 2 Nov 2026: tenders.gov.au refuses the feed to our runner (HTTP 403).
  # We don't get around blocks; AusTender reaches us through its own email alerts.
  austender:
    enabled: false
    dataset: efe713db-f91e-4708-9edb-e3d3e321cfee

  # OpenGov public listings (approach from cliwant/mcp-sam-gov). OFF until
  # OpenGov's terms have been checked (see the plan).
  opengov:
    enabled: false
